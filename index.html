<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REC-G</title>
<link rel="alternate" type="application/rss+xml" title="新着" href="feed.xml">
<style>
  :root { --bg:#f3eee6; --card:#fbf8f3; --ink:#2b2622; --sub:#7a7068; --line:#ddd3c6; --egg:#e9b949; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height:1.6; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .lead { color:var(--sub); margin:0 0 20px; font-size:.95rem; }
  .lead a { color:var(--sub); }
  nav { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 22px; }
  nav button { border:1px solid var(--line); background:transparent; color:var(--ink);
               padding:8px 18px; border-radius:999px; font-size:1rem; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  nav .upd { margin-left:auto; color:var(--sub); font-size:.85rem; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:18px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);
          display:flex; flex-direction:column; }
  .cover { aspect-ratio: 16/9; background:#e8e0d4 center/cover no-repeat; position:relative; display:block; text-decoration:none; }
  .cover.none { display:flex; align-items:center; justify-content:center; font-size:2.4rem; }
  .new { position:absolute; top:8px; left:8px; background:#3f7d4e; color:#fff; font-size:.75rem;
         padding:2px 10px; border-radius:999px; }
  .body { padding:12px 14px 14px; }
  .body h3 { margin:0 0 4px; font-size:1.05rem; }
  .body h3 a { color:inherit; text-decoration:none; }
  .meta { color:var(--sub); font-size:.8rem; margin:0 0 8px; }
  .body ul { list-style:none; margin:0; padding:8px 0 0; border-top:1px dashed var(--line); }
  .body li { display:flex; gap:8px; font-size:.85rem; margin:4px 0; }
  .body li time { color:var(--sub); flex:none; }
  .body li a { color:inherit; text-decoration:none; overflow:hidden; display:-webkit-box;
               -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .body li a:hover, .body h3 a:hover { text-decoration:underline; }
  details { border-bottom:1px solid var(--line); padding: 10px 0; }
  summary { cursor:pointer; font-size:1.2rem; font-weight:700; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; color:var(--sub); font-size:.8rem; }
  details[open] summary::before { content:"▾ "; }
  summary small { font-weight:400; color:var(--sub); font-size:.85rem; margin-left:8px; }
  details .note { color:var(--sub); margin:4px 0 12px; font-size:.9rem; }
  details .grid { margin-top: 12px; }
  .more { margin:20px auto 0; display:block; }
  .notice { margin-top:36px; padding-top:18px; border-top:1px solid var(--line); }
  .notice h2 { font-size:1rem; color:var(--sub); margin:0 0 12px; font-weight:600; }
  footer { margin-top:48px; color:var(--sub); font-size:.8rem; text-align:center; }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1 id="title">🥚 REC-G</h1>
  <p class="lead">あちこちで産んだ卵を、ここに集めています。 <a href="feed.xml">📡 RSS</a></p>
  <nav>
    <button data-view="recent">新着順</button>
    <button data-view="shelf">棚ごと</button>
    <button data-view="all">ぜんぶ</button>
    <span class="upd" id="upd"></span>
  </nav>
  <section id="garden"></section>
  <footer>REC-G｜RSS Egg Collection Garden — 卵は、それぞれの巣に。表紙と目次だけ、ここに。</footer>
</main>
<script>
(() => {
  const NEW_DAYS = 7, FIRST = 8;
  const $g = document.getElementById('garden');
  let data = null, view = 'recent', showAll = false;
  try { view = localStorage.getItem('recg-view') || 'recent'; } catch (e) {}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ymd = iso => { const d = new Date(iso); return isNaN(d) ? '' :
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
  const isNew = iso => iso && (Date.now() - new Date(iso)) < NEW_DAYS * 864e5;
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch (e) { return ''; } };

  function card(e) {
    const img = (e.latest || []).map(i => i.image).find(Boolean);
    const cover = img
      ? `<a class="cover" href="${esc(e.link)}" style="background-image:url('${esc(img)}')">${isNew(e.latest_at) ? '<span class="new">入荷</span>' : ''}</a>`
      : `<a class="cover none" href="${esc(e.link)}">🥚${isNew(e.latest_at) ? '<span class="new">入荷</span>' : ''}</a>`;
    const items = (e.latest || []).map(i =>
      `<li><time>${ymd(i.date)}</time><a href="${esc(i.url)}">${esc(i.title)}</a></li>`).join('');
    return `<article class="card">${cover}<div class="body">
      <h3><a href="${esc(e.link)}">${esc(e.title)}</a></h3>
      <p class="meta">${esc(host(e.link))}${e.latest_at ? '｜最終更新 ' + ymd(e.latest_at) : ''}</p>
      ${items ? `<ul>${items}</ul>` : ''}</div></article>`;
  }
  const grid = list => `<div class="grid">${list.map(card).join('')}</div>`;

  // 棚id が info の卵（管理人からの便りなど）は、どの見せ方でも罫線の下に分けて置く
  const NOTICE = 'info';
  function noticeBlock(list) {
    if (!list.length) return '';
    const sh = data.shelves.find(s => s.id === NOTICE) || { name: '📮 便り' };
    return `<section class="notice"><h2>${esc(sh.name)}</h2>${grid(list)}</section>`;
  }

  function render() {
    document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
    const notices = data.eggs.filter(e => e.shelf === NOTICE).sort((a, b) => a.order - b.order);
    const eggs = data.eggs.filter(e => e.shelf !== NOTICE);
    if (view === 'recent') {
      eggs.sort((a, b) => (b.latest_at || '').localeCompare(a.latest_at || ''));
      const list = showAll ? eggs : eggs.slice(0, FIRST);
      $g.innerHTML = grid(list) + (eggs.length > FIRST && !showAll ? '<button class="more" id="more">もっと見る</button>' : '') + noticeBlock(notices);
      const m = document.getElementById('more'); if (m) m.onclick = () => { showAll = true; render(); };
    } else if (view === 'shelf') {
      // 「## * 名前」の棚があれば、そこが棚に入れていない卵の置き場。なければ一番下に「まだ棚のないもの」
      const known = new Set(data.shelves.filter(s => s.id !== '*').map(s => s.id));
      const base = data.shelves.filter(s => s.id !== NOTICE);
      const rows = base.some(s => s.id === '*') ? base
        : base.concat([{ id: '*', name: '🌱 まだ棚のないもの', note: '' }]);
      const parts = rows.map(s => {
        const list = eggs.filter(e => s.id === '*' ? !known.has(e.shelf) : e.shelf === s.id).sort((a, b) => a.order - b.order);
        if (!list.length) return '';
        const fresh = list.filter(e => isNew(e.latest_at)).length;
        return `<details><summary>${esc(s.name)}<small>${list.length}件${fresh ? '・入荷' + fresh : ''}</small></summary>
          ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}${grid(list)}</details>`;
      });
      $g.innerHTML = parts.join('') + noticeBlock(notices);
    } else {
      const col = new Intl.Collator('ja');
      eggs.sort((a, b) => col.compare(a.title || '', b.title || ''));
      $g.innerHTML = grid(eggs) + noticeBlock(notices);
    }
  }

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    view = b.dataset.view; showAll = false;
    try { localStorage.setItem('recg-view', view); } catch (e) {}
    render();
  });

  fetch('garden.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
    data = d;
    document.title = d.title + '｜REC-G';
    document.getElementById('title').textContent = '🥚 ' + d.title;
    document.getElementById('upd').textContent = '集卵 ' + ymd(d.updated);
    render();
  }).catch(() => { $g.innerHTML = '<p>まだ卵が届いていません。仕入れ係（Actions）が一度動くと並びます。</p>'; });
})();
</script>
</body>
</html>
